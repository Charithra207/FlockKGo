services:
  # ── FastAPI Backend ──────────────────────────────────────────────────────────
  - type: web
    name: packvote-api
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: packvote-db
          property: connectionString
      - key: OPENAI_API_KEY
        sync: false          # you set this manually in Render dashboard
      - key: FRONTEND_BASE_URL
        sync: false          # set to your Vercel URL once friend deploys
      - key: ENVIRONMENT
        value: production
    healthCheckPath: /health

# ── PostgreSQL Database ───────────────────────────────────────────────────────
databases:
  - name: packvote-db
    databaseName: flockgo
    user: flockgo
    plan: free
