services:
  # ── FastAPI API ────────────────────────────────────────────────────────────
  - type: web
    name: packvote-api
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: bash build.sh && uvicorn app.main:app --host 0.0.0.0 --port $PORT --workers 2
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: packvote-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          name: packvote-redis
          type: redis
          property: connectionString
      - key: OPENAI_API_KEY
        sync: false          # set manually in Render dashboard
      - key: FRONTEND_BASE_URL
        sync: false          # set to Vercel URL after friend deploys
      - key: API_SECRET_KEY
        sync: false          # set manually: openssl rand -hex 32
      - key: ENVIRONMENT
        value: production

  # ── Celery Worker ──────────────────────────────────────────────────────────
  - type: worker
    name: packvote-worker
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: celery -A app.workers.celery_app:celery_app worker --loglevel=info --concurrency=2
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: packvote-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          name: packvote-redis
          type: redis
          property: connectionString
      - key: OPENAI_API_KEY
        sync: false
      - key: ENVIRONMENT
        value: production

# ── PostgreSQL ─────────────────────────────────────────────────────────────
databases:
  - name: packvote-db
    databaseName: flockgo
    user: flockgo
    plan: free

# ── Redis ──────────────────────────────────────────────────────────────────
  - type: redis
    name: packvote-redis
    plan: free
    maxmemoryPolicy: allkeys-lru
